name: Deploy Hugo site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.150.0
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
        run: |
          hugo \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"
      - name: Password-protect project pages
        env:
          STATICRYPT_PW_TEA: ${{ secrets.STATICRYPT_PW_TEA }}
          STATICRYPT_PW_TRANSPORTEFFECTS: ${{ secrets.STATICRYPT_PW_TRANSPORTEFFECTS }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          for dir in public/projects/*/; do
            name="$(basename "$dir")"
            var_name="STATICRYPT_PW_$(echo "$name" | tr '[:lower:]' '[:upper:]')"
            pw="${!var_name:-}"
            if [ -z "$pw" ]; then
              echo "::error::No password secret set for project '$name' (expected secret $var_name, mapped in this step's env block)"
              exit 1
            fi
            rm -rf /tmp/staticrypt_out
            npx --yes staticrypt@3.5.4 "$dir" -r -p "$pw" -d /tmp/staticrypt_out --short \
              --template-title "Защищённая страница" \
              --template-instructions "Введите пароль для доступа к странице проекта" \
              --template-button "Войти" \
              --template-placeholder "Пароль" \
              --template-error "Неверный пароль"
            rm -rf "$dir"
            mv "/tmp/staticrypt_out/$name" "$dir"
            echo "Encrypted $dir"
          done

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
